<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found · Belvoir Hotel &amp; Residence</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230C1B33'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia,serif' font-size='18' fill='%23B08D57'%3EB%3C/text%3E%3C/svg%3E">
  <style>
    /* Self-contained on purpose: an error page should not depend on anything
       else loading. System serif stands in for the display face. */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #FAF8F5;
      color: #1A1A1A;
      font-family: Georgia, 'Times New Roman', serif;
      text-align: center;
      padding: 2rem;
    }
    main { max-width: 26rem; }
    .mark {
      font-size: 1.3rem;
      letter-spacing: 0.18em;
      color: #0C1B33;
      margin-bottom: 2.5rem;
    }
    .mark span { color: #B08D57; }
    h1 {
      font-weight: 400;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      color: #0C1B33;
      margin: 0 0 0.75rem;
    }
    p { line-height: 1.7; color: #6B6560; margin: 0 0 2rem; }
    .links { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    a.btn {
      display: inline-block;
      padding: 0.85rem 1.8rem;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: #0C1B33;
      color: #fff;
    }
    a.btn--ghost { background: transparent; color: #0C1B33; border: 1px solid rgba(176,141,87,0.45); }
    a.btn:hover { background: #B08D57; color: #fff; }
    a:focus-visible { outline: 2px solid #B08D57; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark">BELVOIR<span>.</span></div>
    <h1>This page has checked out</h1>
    <p>The address may have been mistyped, or the page has moved.
       Everything about the hotel — rooms, rates and booking — is on the main page.</p>
    <div class="links">
      <a class="btn" href="/">Back to the hotel</a>
      <a class="btn btn--ghost" href="/#contact">Contact us</a>
    </div>
  </main>
</body>
</html>
