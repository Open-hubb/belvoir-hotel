<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookings Admin · Belvoir Hotel</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230C1B33'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia,serif' font-size='18' fill='%23B08D57'%3EB%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Josefin+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0C1B33;
      --navy-light: #1A2D4A;
      --gold: #B08D57;
      --gold-light: #C9A96E;
      --cream: #F8F4EC;
      --paper: #FFFDF8;
      --peach: #F0E7D3;
      --blue: #C7DCEC;
      --sage: #D8E6EE;
      --ink-soft: rgba(12, 27, 51, 0.65);
      --green-ok: #2E7D57;
      --red-warn: #C34A36;
      --serif: 'Cormorant Garamond', serif;
      --sans: 'Josefin Sans', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* The dashboard is read at arm's length all day, so the whole rem scale is
       lifted rather than resizing each rule. Type, padding and gaps grow
       together and the layout keeps its proportions. */
    html { font-size: 115%; }

    body {
      font-family: var(--sans);
      font-weight: 400;
      color: var(--navy);
      background-color: var(--cream);
      background-image:
        radial-gradient(46% 40% at 8% 4%, rgba(240, 231, 211, 0.8) 0%, transparent 100%),
        radial-gradient(42% 36% at 94% 8%, rgba(199, 220, 236, 0.6) 0%, transparent 100%),
        radial-gradient(44% 40% at 6% 94%, rgba(216, 230, 238, 0.55) 0%, transparent 100%);
      background-attachment: fixed;
      min-height: 100vh;
      line-height: 1.6;
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: clamp(1rem, 3vw, 2.5rem); }

    /* ── Login ── */
    .login {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login__card {
      background: var(--paper);
      border-radius: 24px;
      box-shadow: 0 2px 8px rgba(12,27,51,0.06), 0 24px 60px rgba(12,27,51,0.14);
      padding: clamp(2rem, 5vw, 3rem);
      width: min(420px, 100%);
      text-align: center;
    }
    .login__logo { width: 140px; height: auto; margin: 0 auto 1.25rem; display: block; }
    .login__title { font-family: var(--serif); font-size: 1.9rem; font-weight: 600; }
    .login__sub { font-size: 0.88rem; color: var(--ink-soft); margin: 0.4rem 0 1.5rem; }
    .login__label {
      display: block;
      text-align: left;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 0.4rem;
    }
    .login input {
      width: 100%;
      font-family: var(--sans);
      font-size: 1rem;
      padding: 0.9rem 1.1rem;
      border: 1.5px solid rgba(12,27,51,0.18);
      border-radius: 14px;
      margin-bottom: 0.9rem;
      background: #fff;
    }
    .login input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(176,141,87,0.18); }
    .login__err { display: none; color: var(--red-warn); font-size: 0.86rem; margin-bottom: 0.9rem; }
    .login__err.show { display: block; }

    .btn {
      font-family: var(--sans);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: var(--navy);
      color: var(--paper);
      border: none;
      border-radius: 999px;
      padding: 0.95rem 2.2rem;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(12,27,51,0.25); }
    .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    .btn--ghost { background: transparent; color: var(--navy); border: 1.5px solid rgba(12,27,51,0.25); }
    .btn--ghost:hover { box-shadow: none; border-color: var(--navy); }
    .btn--sm { padding: 0.55rem 1.1rem; font-size: 0.68rem; }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ── Dashboard ── */
    .dash { display: none; }
    .dash.active { display: block; }
    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: clamp(1.5rem, 3vh, 2.25rem);
    }
    .head__brand { display: flex; align-items: center; gap: 1rem; }
    .head__brand img { width: 84px; height: auto; }
    .head__title { font-family: var(--serif); font-size: clamp(1.5rem, 3vw, 2.1rem); font-weight: 600; line-height: 1.1; }
    .head__sub { font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
    .head__actions { display: flex; gap: 0.6rem; }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .stat {
      background: var(--paper);
      border-radius: 18px;
      padding: 1.1rem 1.3rem;
      box-shadow: 0 2px 6px rgba(12,27,51,0.05), 0 14px 32px rgba(12,27,51,0.08);
    }
    /* Cormorant defaults to oldstyle figures, where 1 reads as I and 0 as o.
       Fine in prose, wrong for a number someone has to scan. */
    .stat strong, .card__money strong, .card__date, .badge {
      font-variant-numeric: lining-nums tabular-nums;
      font-feature-settings: 'lnum' 1, 'tnum' 1;
    }
    .stat strong { display: block; font-family: var(--serif); font-size: 1.7rem; font-weight: 600; line-height: 1.2; }
    .stat span { font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }
    .stat--gold strong { color: var(--gold); }
    .stat--green strong { color: var(--green-ok); }
    .stat--red strong { color: var(--red-warn); }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1.1rem;
    }
    .tabs { display: flex; background: var(--paper); border-radius: 999px; padding: 0.25rem; box-shadow: 0 2px 8px rgba(12,27,51,0.07); }
    .tab {
      font-family: var(--sans);
      font-size: 0.74rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: none;
      background: none;
      color: var(--ink-soft);
      border-radius: 999px;
      padding: 0.55rem 1.15rem;
      cursor: pointer;
    }
    .tab.active { background: var(--navy); color: var(--paper); }
    .badge {
      display: inline-block;
      min-width: 17px;
      padding: 0 5px;
      margin-left: 5px;
      border-radius: 999px;
      background: var(--gold);
      color: var(--navy);
      font-size: 0.66rem;
      line-height: 17px;
      text-align: center;
      vertical-align: middle;
    }
    .badge:empty { display: none; }
    .enq__msg {
      grid-column: 1 / -1;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--navy);
      background: var(--cream);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      white-space: pre-wrap;
    }
    .pill--new { background: rgba(176,141,87,0.18); color: #8A6A34; }
    .pill--left { background: rgba(195,74,54,0.1); color: #A93A28; }
    .card--left { border-left: 3px solid rgba(195,74,54,0.45); }
    .pill--done { background: rgba(46,125,87,0.14); color: var(--green-ok); }
    .search {
      flex: 1;
      min-width: 180px;
      font-family: var(--sans);
      font-size: 0.9rem;
      padding: 0.7rem 1.1rem;
      border: 1.5px solid rgba(12,27,51,0.14);
      border-radius: 999px;
      background: var(--paper);
    }
    .search:focus { outline: none; border-color: var(--gold); }

    .list { display: flex; flex-direction: column; gap: 0.8rem; }
    .card {
      background: var(--paper);
      border-radius: 18px;
      padding: 1.1rem 1.3rem;
      box-shadow: 0 2px 6px rgba(12,27,51,0.05), 0 12px 28px rgba(12,27,51,0.07);
      display: grid;
      grid-template-columns: 1.15fr 1fr 0.9fr auto;
      gap: 1rem;
      align-items: center;
    }
    .card__who strong { font-weight: 500; font-size: 1rem; display: block; }
    .card__who a { color: var(--ink-soft); font-size: 0.82rem; text-decoration: none; display: block; word-break: break-all; }
    .card__who a:hover { color: var(--gold); }
    .card__meta { font-size: 0.84rem; color: var(--ink-soft); }
    .card__meta strong { color: var(--navy); font-weight: 500; display: block; font-size: 0.92rem; }
    .card__money { font-size: 0.82rem; color: var(--ink-soft); }
    .card__money strong { display: block; font-family: var(--serif); font-size: 1.25rem; font-weight: 600; color: var(--navy); }
    .card__side { display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; }
    .pill {
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 500;
      border-radius: 999px;
      padding: 0.35rem 0.9rem;
    }
    .pill--paid { background: rgba(46,125,87,0.14); color: var(--green-ok); }
    .pill--unpaid { background: rgba(195,74,54,0.12); color: var(--red-warn); }
    .pill--dep { background: var(--peach); color: var(--navy); }
    .pill--cancelled { background: rgba(12,27,51,0.1); color: var(--ink-soft); }

    /* Blocked dates */
    .card--form { display: block; }
    .blk__form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.75rem;
      align-items: end;
    }
    .blk__field { display: flex; flex-direction: column; gap: 0.3rem; }
    .blk__field--wide { grid-column: span 2; }
    .blk__field label {
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .blk__field select, .blk__field input {
      font-family: var(--sans);
      font-size: 0.9rem;
      padding: 0.6rem 0.75rem;
      border: 1.5px solid rgba(12,27,51,0.18);
      border-radius: 10px;
      background: #fff;
      min-height: 44px;
    }
    .blk__field select:focus, .blk__field input:focus {
      outline: none; border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(176,141,87,0.18);
    }
    .blk__note { color: var(--red-warn); font-size: 0.86rem; margin-top: 0.6rem; }
    .blk__note:empty { display: none; }
    @media (max-width: 620px) { .blk__field--wide { grid-column: span 1; } }

    /* A cancelled booking stays on the list as a record, but must not read as
       something the front desk still has to act on. */
    .card--cancelled { opacity: 0.55; }
    .card--cancelled .card__who strong,
    .card--cancelled .card__meta strong { text-decoration: line-through; }
    .card__requests {
      grid-column: 1 / -1;
      font-size: 0.84rem;
      color: var(--ink-soft);
      background: var(--cream);
      border-radius: 12px;
      padding: 0.55rem 0.9rem;
    }
    .card__date { font-size: 0.74rem; color: rgba(12,27,51,0.45); }
    .empty {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--ink-soft);
      font-family: var(--serif);
      font-size: 1.3rem;
      font-style: italic;
    }
    .loading { text-align: center; padding: 3rem; color: var(--ink-soft); }

    @media (max-width: 860px) {
      .card { grid-template-columns: 1fr 1fr; }
      .card__side { align-items: flex-start; flex-direction: row; flex-wrap: wrap; grid-column: 1 / -1; }
    }
    @media (max-width: 520px) {
      .card { grid-template-columns: 1fr; }
      .head__actions { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- Login -->
  <div class="login" id="loginView">
    <div class="login__card">
      <img src="images/logo.png" alt="Belvoir" class="login__logo" width="610" height="400">
      <h1 class="login__title">Bookings Admin</h1>
      <p class="login__sub">Managers only · sign in to continue</p>
      <label class="login__label" for="emailInput">Email</label>
      <input type="email" id="emailInput" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false">
      <label class="login__label" for="pwInput" style="margin-top:0.9rem;">Password</label>
      <input type="password" id="pwInput" autocomplete="current-password">
      <p class="login__err" id="loginErr">Email or password not recognised.</p>
      <button class="btn" id="loginBtn" style="width:100%;margin-top:1.1rem;">Sign In</button>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dash" id="dashView">
    <div class="wrap">
      <header class="head">
        <div class="head__brand">
          <img src="images/logo.png" alt="Belvoir" width="610" height="400">
          <div>
            <div class="head__sub">Belvoir Hotel</div>
            <h1 class="head__title">Bookings</h1>
          </div>
        </div>
        <div class="head__actions">
          <button class="btn btn--ghost btn--sm" id="refreshBtn">Refresh</button>
          <button class="btn btn--ghost btn--sm" id="logoutBtn">Log Out</button>
        </div>
      </header>

      <main>
      <div class="stats" id="stats"></div>

      <div class="toolbar">
        <div class="tabs" id="views">
          <button class="tab active" data-v="bookings">Bookings</button>
          <button class="tab" data-v="enquiries">Enquiries <span class="badge" id="enqBadge"></span></button>
          <button class="tab" data-v="payments">Payments <span class="badge" id="payBadge"></span></button>
          <button class="tab" data-v="blocks">Blocked</button>
        </div>
        <div class="tabs" id="tabs">
          <button class="tab active" data-f="all">All</button>
          <button class="tab" data-f="paid">Paid</button>
          <button class="tab" data-f="unpaid">Unpaid</button>
          <button class="tab" data-f="abandoned">Abandoned</button>
        </div>
        <label class="sr-only" for="search">Search bookings</label>
        <input class="search" id="search" type="search" placeholder="Search name, email, phone, room…">
      </div>

      <div class="list" id="list"><div class="loading">Loading bookings…</div></div>
      </main>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    // Nothing is held in the page. The session lives in an httpOnly cookie
    // that JavaScript cannot read, so injected script has nothing to steal.
    let ME = null;
    let BOOKINGS = [];
    let ENQUIRIES = [];
    let PAYMENTS = [];
    let BLOCKS = [];
    let FILTER = 'all';
    let VIEW = 'bookings';

    const fmtMoney = n => '$' + Number(n).toLocaleString();
    const fmtDate = s => new Date(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    const fmtWhen = s => new Date(s).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    // Escapes quotes as well as angle brackets. Guest-supplied values are put
    // inside attributes (tel:, mailto:), and textContent leaves quotes intact,
    // so a phone number of `" onmouseover="…` would otherwise close the
    // attribute and run script with this page's session key.
    const esc = s => String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');

    // The address replies should be sent from. mailto cannot set the sender, so
    // this is used to pick the right account in webmail and to warn if the mail
    // app is signed in as somebody else.
    const REPLY_FROM = 'info@belvoir-estates.com';

    /**
     * Opens the admin's mail client with a reply already drafted: greeting,
     * a space to type, signature, and the guest's original enquiry quoted
     * underneath so there is context without switching back to the dashboard.
     */
    function replyLink(e, STAY) {
      const first = String(e.name || '').trim().split(/\s+/)[0] || 'there';
      const quoted = String(e.message || '')
        .split('\n')
        .map(l => '> ' + l)
        .join('\n');
      const body =
        'Dear ' + first + ',\n\n' +
        'Thank you for getting in touch with Belvoir Hotel & Residence.\n\n' +
        '\n\n' +
        'Kind regards,\n' +
        'Belvoir Hotel & Residence\n' +
        'Belvoir Avenue, off Wilkinson Road, Freetown\n' +
        '+232 77 777 063 · ' + REPLY_FROM + '\n\n' +
        '--------------------------------------------\n' +
        'On ' + fmtWhen(e.created_at) + ' ' + (e.name || 'a guest') + ' wrote:\n' +
        '(' + ((STAY && STAY[e.stay_type]) || 'General enquiry') + ')\n\n' +
        quoted;

      // Encode everything, then put the @ back: some mail clients read a
      // percent-encoded address as empty, and encoding first means a stray
      // quote in the address cannot break out of the href attribute.
      const to = encodeURIComponent(e.email || '').replace(/%40/g, '@');
      return 'mailto:' + to +
             '?subject=' + encodeURIComponent('Re: your enquiry - Belvoir Hotel') +
             '&body=' + encodeURIComponent(body);
    }

    async function api(method, body, path) {
      const res = await fetch(path || '/api/bookings', {
        method,
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined
      });
      if (res.status === 401) throw new Error('unauthorized');
      if (!res.ok) {
        // Surface the server's wording so a clash explains itself rather than
        // showing a generic failure
        const detail = await res.json().catch(() => ({}));
        throw new Error(detail.error || 'request failed');
      }
      return res.json();
    }

    async function load() {
      $('list').innerHTML = '<div class="loading">Loading bookings…</div>';
      try {
        const [bk, eq, pay, blk] = await Promise.all([
          api('GET'),
          api('GET', null, '/api/enquiries').catch(() => ({ enquiries: [] })),
          api('GET', null, '/api/payments').catch(() => ({ payments: [] })),
          api('GET', null, '/api/blocks').catch(() => ({ blocks: [] }))
        ]);
        BOOKINGS = bk.bookings;
        ENQUIRIES = eq.enquiries || [];
        PAYMENTS = pay.payments || [];
        BLOCKS = blk.blocks || [];
        render();
        $('loginView').style.display = 'none';
        $('dashView').classList.add('active');
        if (ME && $('whoami')) $('whoami').textContent = ME.name || ME.email;
      } catch (e) {
        if (e.message === 'unauthorized') {
          ME = null;
          $('dashView').classList.remove('active');
          $('loginView').style.display = 'flex';
          $('loginErr').classList.add('show');
        } else {
          $('list').innerHTML = '<div class="empty">Could not reach the server.<br>' +
            '<span style="font-size:0.8rem;font-family:var(--sans);font-style:normal;">' +
            (location.hostname === 'localhost'
              ? 'Running locally? The API needs <code>node serve.mjs</code> (which now serves /api) or <code>vercel dev</code>.'
              : 'Check your connection and press Refresh.') +
            '</span></div>';
        }
      }
    }

    const isLeft = b => b.stage === 'started';

    function stats() {
      const done = BOOKINGS.filter(b => !isLeft(b));
      const left = BOOKINGS.filter(isLeft);
      const paid = done.filter(b => b.payment_status === 'paid');
      const unpaid = done.filter(b => b.payment_status !== 'paid');
      const collected = paid.reduce((s, b) => s + Number(b.amount_due || 0), 0);
      const outstanding = unpaid.reduce((s, b) => s + Number(b.amount_due || 0), 0);
      $('stats').innerHTML =
        '<div class="stat"><strong>' + done.length + '</strong><span>Bookings</span></div>' +
        '<div class="stat stat--green"><strong>' + paid.length + '</strong><span>Paid</span></div>' +
        '<div class="stat stat--red"><strong>' + unpaid.length + '</strong><span>Unpaid</span></div>' +
        '<div class="stat stat--gold"><strong>' + fmtMoney(collected) + '</strong><span>Collected</span></div>' +
        '<div class="stat"><strong>' + fmtMoney(outstanding) + '</strong><span>Awaiting Payment</span></div>' +
        '<div class="stat stat--red"><strong>' + left.length + '</strong><span>Left at Payment</span></div>';
    }

    function render() {
      document.getElementById('tabs').style.display = VIEW === 'bookings' ? '' : 'none';
      document.getElementById('enqBadge').textContent =
        ENQUIRIES.filter(e => e.status !== 'handled').length || '';
      document.getElementById('payBadge').textContent =
        PAYMENTS.filter(p => !p.matched).length || '';
      if (VIEW === 'enquiries') return renderEnquiries();
      if (VIEW === 'payments') return renderPayments();
      if (VIEW === 'blocks') return renderBlocks();
      stats();
      const q = $('search').value.trim().toLowerCase();
      let rows = BOOKINGS;
      if (FILTER === 'abandoned') rows = rows.filter(isLeft);
      else if (FILTER !== 'all') rows = rows.filter(b => !isLeft(b) && (FILTER === 'paid') === (b.payment_status === 'paid'));
      if (q) rows = rows.filter(b =>
        [b.guest_name, b.guest_email, b.guest_phone, b.room_name].join(' ').toLowerCase().includes(q));
      if (!rows.length) {
        $('list').innerHTML = '<div class="empty">No bookings here yet.</div>';
        return;
      }
      $('list').innerHTML = rows.map(b => {
        const paid = b.payment_status === 'paid';
        const left = isLeft(b);
        return '<article class="card' + (left ? ' card--left' : '') + (b.status === 'cancelled' ? ' card--cancelled' : '') + '" data-id="' + b.id + '">' +
          '<div class="card__who">' +
            '<strong>' + esc(b.guest_name) + '</strong>' +
            '<a href="tel:' + esc(b.guest_phone) + '">' + esc(b.guest_phone) + '</a>' +
            '<a href="mailto:' + esc(b.guest_email) + '">' + esc(b.guest_email) + '</a>' +
            '<span class="card__date">Booked ' + fmtWhen(b.created_at) + ' · #' + b.id + '</span>' +
          '</div>' +
          '<div class="card__meta">' +
            '<strong>' + esc(b.room_name) + '</strong>' +
            fmtDate(b.checkin) + ' → ' + fmtDate(b.checkout) +
            '<br>' + b.nights + (b.nights == 1 ? ' night' : ' nights') + ' · ' + esc(b.guests) + ' guest(s)' +
          '</div>' +
          '<div class="card__money">' +
            (left
              ? '<strong>' + fmtMoney(b.total) + '</strong>stay value · never chose payment'
              : '<strong>' + fmtMoney(b.amount_due) + '</strong>' +
                (b.payment_option === 'deposit'
                  ? '30% deposit · ' + fmtMoney(b.total) + ' total'
                  : 'paid in full')) +
          '</div>' +
          '<div class="card__side">' +
            (left
              ? '<span class="pill pill--left">Left at payment</span>' +
                '<a class="btn btn--sm" style="text-decoration:none;" href="mailto:' + esc(b.guest_email) +
                  '?subject=' + encodeURIComponent('Your Belvoir booking - can we help?') + '">Follow Up</a>'
              : '<span class="pill ' + (paid ? 'pill--paid' : 'pill--unpaid') + '">' + (paid ? 'Paid' : 'Unpaid') + '</span>' +
                (b.payment_option === 'deposit' ? '<span class="pill pill--dep">Deposit</span>' : '') +
                '<button class="btn btn--sm ' + (paid ? 'btn--ghost' : '') + '" onclick="toggle(' + b.id + ', \'' + (paid ? 'unpaid' : 'paid') + '\')">' +
                  (paid ? 'Mark Unpaid' : 'Mark Paid') + '</button>') +
            (b.status === 'cancelled'
              ? '<span class="pill pill--cancelled">Cancelled</span>' +
                '<button class="btn btn--sm btn--ghost" onclick="setBookingStatus(' + b.id + ', \'active\')">Restore</button>'
              : '<button class="btn btn--sm btn--ghost" onclick="setBookingStatus(' + b.id + ', \'cancelled\')">Cancel</button>') +
          '</div>' +
          (b.requests ? '<div class="card__requests"><b>Requests:</b> ' + esc(b.requests) + '</div>' : '') +
        '</article>';
      }).join('');
    }

    function renderEnquiries() {
      const q = $('search').value.trim().toLowerCase();
      const nw = ENQUIRIES.filter(e => e.status !== 'handled').length;
      const longs = ENQUIRIES.filter(e => e.stay_type === 'long' || e.source === 'long-stay').length;
      $('stats').innerHTML =
        '<div class="stat"><strong>' + ENQUIRIES.length + '</strong><span>Total Enquiries</span></div>' +
        '<div class="stat stat--gold"><strong>' + nw + '</strong><span>Awaiting Reply</span></div>' +
        '<div class="stat stat--green"><strong>' + (ENQUIRIES.length - nw) + '</strong><span>Handled</span></div>' +
        '<div class="stat"><strong>' + longs + '</strong><span>Long Stay</span></div>';

      let rows = ENQUIRIES;
      if (q) rows = rows.filter(e =>
        [e.name, e.email, e.phone, e.message, e.stay_type].join(' ').toLowerCase().includes(q));

      if (!rows.length) {
        $('list').innerHTML = '<div class="empty">No enquiries yet.</div>';
        return;
      }

      const STAY = { short: 'Short stay', extended: 'Extended stay', long: 'Long term', business: 'Business' };
      $('list').innerHTML = rows.map(e => {
        const done = e.status === 'handled';
        const subject = encodeURIComponent('Re: your enquiry - Belvoir Hotel');
        const reply = replyLink(e, STAY);
        return '<article class="card" data-eid="' + e.id + '">' +
          '<div class="card__who">' +
            '<strong>' + esc(e.name) + '</strong>' +
            '<a href="mailto:' + esc(e.email) + '?subject=' + subject + '">' + esc(e.email) + '</a>' +
            (e.phone ? '<a href="tel:' + esc(e.phone) + '">' + esc(e.phone) + '</a>' : '') +
            '<span class="card__date">' + fmtWhen(e.created_at) + ' &middot; #' + e.id + '</span>' +
          '</div>' +
          '<div class="card__meta">' +
            '<strong>' + (STAY[e.stay_type] || 'General enquiry') + '</strong>' +
            (e.source === 'long-stay' ? 'From the long stay banner' : 'From the contact form') +
          '</div>' +
          '<div class="card__side">' +
            '<span class="pill ' + (done ? 'pill--done' : 'pill--new') + '">' + (done ? 'Handled' : 'New') + '</span>' +
            '<a class="btn btn--sm" style="text-decoration:none;" href="' + reply + '">Reply</a>' +
            '<button class="btn btn--sm btn--ghost" onclick="markEnquiry(' + e.id + ', \'' + (done ? 'new' : 'handled') + '\')">' +
              (done ? 'Mark New' : 'Mark Handled') + '</button>' +
          '</div>' +
          '<div class="enq__msg">' + esc(e.message) + '</div>' +
        '</article>';
      }).join('');
    }

    function renderPayments() {
      const q = $('search').value.trim().toLowerCase();
      const matched = PAYMENTS.filter(p => p.matched);
      const orphan = PAYMENTS.filter(p => !p.matched);
      const taken = matched.reduce((s, p) => s + Number(p.amount || 0), 0);
      $('stats').innerHTML =
        '<div class="stat"><strong>' + PAYMENTS.length + '</strong><span>Payments Received</span></div>' +
        '<div class="stat stat--green"><strong>' + matched.length + '</strong><span>Matched</span></div>' +
        '<div class="stat stat--red"><strong>' + orphan.length + '</strong><span>Unmatched</span></div>' +
        '<div class="stat stat--gold"><strong>' + fmtMoney(taken) + '</strong><span>Confirmed Total</span></div>';

      let rows = PAYMENTS;
      if (q) rows = rows.filter(p =>
        [p.payer_name, p.payer_email, p.provider_ref, p.reference, p.guest_name].join(' ').toLowerCase().includes(q));

      if (!rows.length) {
        $('list').innerHTML = '<div class="empty">No payments recorded yet.<br>' +
          '<span style="font-size:0.8rem;font-family:var(--sans);font-style:normal;">' +
          'They appear here once flot starts sending the webhook.</span></div>';
        return;
      }

      $('list').innerHTML = rows.map(p => {
        const ok = p.matched;
        return '<article class="card' + (ok ? '' : ' card--left') + '">' +
          '<div class="card__who">' +
            '<strong>' + esc(p.payer_name || p.guest_name || 'Unnamed payer') + '</strong>' +
            (p.payer_email ? '<a href="mailto:' + esc(p.payer_email) + '">' + esc(p.payer_email) + '</a>' : '') +
            '<span class="card__date">' + fmtWhen(p.received_at) + (p.provider_ref ? ' · ' + esc(p.provider_ref) : '') + '</span>' +
          '</div>' +
          '<div class="card__meta">' +
            (ok
              ? '<strong>' + esc(p.room_name || 'Booking #' + p.booking_id) + '</strong>Applied to booking #' + p.booking_id
              : '<strong>No matching booking</strong>Needs to be matched by hand') +
          '</div>' +
          '<div class="card__money">' +
            '<strong>' + fmtMoney(p.amount || 0) + '</strong>' + esc(p.currency || '') +
          '</div>' +
          '<div class="card__side">' +
            '<span class="pill ' + (ok ? 'pill--paid' : 'pill--left') + '">' + esc(p.status || (ok ? 'Paid' : 'Unmatched')) + '</span>' +
          '</div>' +
        '</article>';
      }).join('');
    }

    /* ── Blocked dates ──────────────────────────────────────────────
       A block takes a room out of service. Availability treats it exactly
       like a booking, so blocked dates cannot be sold. */

    const BLOCK_ROOMS = [
      ['comfort', 'Superior Double / Comfort'],
      ['standard', 'Deluxe Standard'],
      ['ground-floor', 'Ground Floor One-Bedroom'],
      ['superior-deluxe', 'Superior Deluxe King'],
      ['superior-twin', 'Superior Deluxe Twin'],
      ['studio', 'Studio Penthouse'],
      ['one-bed', 'One-Bedroom Apartment'],
      ['two-bed', 'Two-Bedroom Apartment'],
    ];

    function renderBlocks() {
      const opts = BLOCK_ROOMS.map(([k, n]) => '<option value="' + k + '">' + esc(n) + '</option>').join('');
      const form =
        '<article class="card card--form">' +
          '<div class="blk__form">' +
            '<div class="blk__field"><label for="blkRoom">Room</label>' +
              '<select id="blkRoom">' + opts + '</select></div>' +
            '<div class="blk__field"><label for="blkFrom">From</label>' +
              '<input type="date" id="blkFrom"></div>' +
            '<div class="blk__field"><label for="blkTo">To</label>' +
              '<input type="date" id="blkTo"></div>' +
            '<div class="blk__field blk__field--wide"><label for="blkReason">Reason</label>' +
              '<input type="text" id="blkReason" placeholder="Repainting, deep clean, owner stay…"></div>' +
            '<button class="btn btn--sm" onclick="addBlock()">Block Dates</button>' +
          '</div>' +
          '<p class="blk__note" id="blkErr" role="alert"></p>' +
        '</article>';

      const list = !BLOCKS.length
        ? '<div class="empty">No rooms are blocked. Anything you block here stops being bookable.</div>'
        : BLOCKS.map(b =>
            '<article class="card">' +
              '<div class="card__who"><strong>' + esc(b.room_name || b.room_key) + '</strong>' +
                '<span class="card__date">Added ' + fmtWhen(b.created_at) + '</span></div>' +
              '<div class="card__meta"><strong>Out of service</strong>' +
                fmtDate(b.starts) + ' → ' + fmtDate(b.ends) + '</div>' +
              '<div class="card__money">' + (b.reason ? esc(b.reason) : '<span style="opacity:.5">No reason given</span>') + '</div>' +
              '<div class="card__side">' +
                '<button class="btn btn--sm btn--ghost" onclick="removeBlock(' + b.id + ')">Unblock</button>' +
              '</div>' +
            '</article>').join('');

      $('list').innerHTML = form + list;
    }

    async function addBlock() {
      const err = document.getElementById('blkErr');
      err.textContent = '';
      const payload = {
        room: document.getElementById('blkRoom').value,
        starts: document.getElementById('blkFrom').value,
        ends: document.getElementById('blkTo').value,
        reason: document.getElementById('blkReason').value.trim(),
      };
      if (!payload.starts || !payload.ends) { err.textContent = 'Please choose both dates.'; return; }
      try {
        await api('POST', payload, '/api/blocks');
        const fresh = await api('GET', null, '/api/blocks');
        BLOCKS = fresh.blocks || [];
        render();
      } catch (e) {
        err.textContent = e.message || 'Could not block those dates.';
      }
    }

    async function removeBlock(id) {
      if (!confirm('Unblock these dates? The room becomes bookable again.')) return;
      try {
        await api('DELETE', null, '/api/blocks?id=' + id);
        BLOCKS = BLOCKS.filter(b => b.id !== id);
        render();
      } catch (e) {
        alert('Could not unblock. Please refresh and try again.');
      }
    }

    async function markEnquiry(id, status) {
      const card = document.querySelector('.card[data-eid="' + id + '"]');
      if (card) card.style.opacity = '0.5';
      try {
        await api('PATCH', { id, status }, '/api/enquiries');
        const e = ENQUIRIES.find(x => x.id === id);
        if (e) e.status = status;
        render();
      } catch (err) {
        if (card) card.style.opacity = '1';
        alert('Could not update. Please refresh and try again.');
      }
    }

    async function toggle(id, status) {
      const card = document.querySelector('.card[data-id="' + id + '"]');
      if (card) card.style.opacity = '0.5';
      try {
        await api('PATCH', { id, payment_status: status });
        const b = BOOKINGS.find(x => x.id === id);
        if (b) b.payment_status = status;
        render();
      } catch (e) {
        if (card) card.style.opacity = '1';
        alert('Could not update. Please refresh and try again.');
      }
    }

    /** Cancelling releases the dates, so the room becomes bookable again. */
    async function setBookingStatus(id, status) {
      const b = BOOKINGS.find(x => x.id === id);
      if (status === 'cancelled') {
        const who = b ? b.guest_name + ' · ' + b.room_name : '#' + id;
        if (!confirm('Cancel this booking?\n\n' + who + '\n\nThe dates will be released and the room can be booked by someone else.')) return;
      }
      const card = document.querySelector('.card[data-id="' + id + '"]');
      if (card) card.style.opacity = '0.5';
      try {
        await api('PATCH', { id, status });
        if (b) b.status = status;
        render();
      } catch (e) {
        if (card) card.style.opacity = '1';
        alert('Could not update. Please refresh and try again.');
      }
    }

    async function signIn() {
      const email = $('emailInput').value.trim();
      const password = $('pwInput').value;
      const err = $('loginErr');
      if (!email || !password) {
        err.textContent = 'Enter your email and password.'; err.classList.add('show'); return;
      }
      $('loginBtn').disabled = true;
      $('loginBtn').textContent = 'Signing in…';
      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'login', email, password })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          err.textContent = data.error || 'Email or password not recognised.';
          err.classList.add('show');
          return;
        }
        ME = data.user;
        $('pwInput').value = '';
        err.classList.remove('show');
        load();
      } catch (e) {
        err.textContent = 'Could not reach the server.';
        err.classList.add('show');
      } finally {
        $('loginBtn').disabled = false;
        $('loginBtn').textContent = 'Sign In';
      }
    }
    $('loginBtn').addEventListener('click', signIn);
    $('emailInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('pwInput').focus(); });
    $('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); });
    $('refreshBtn').addEventListener('click', load);
    $('logoutBtn').addEventListener('click', async () => {
      // Revoke the session on the server, not merely forget it here, so a
      // stolen cookie stops working the moment someone signs out.
      try {
        await fetch('/api/auth', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'logout' })
        });
      } catch (e) {}
      location.reload();
    });
    $('views').addEventListener('click', e => {
      if (!e.target.dataset.v) return;
      VIEW = e.target.dataset.v;
      document.querySelectorAll('#views .tab').forEach(t => t.classList.toggle('active', t === e.target));
      $('search').placeholder =
        VIEW === 'enquiries' ? 'Search name, email, message…' :
        VIEW === 'payments'  ? 'Search payer, reference, room…' :
                               'Search name, email, phone, room…';
      render();
    });
    $('tabs').addEventListener('click', e => {
      if (!e.target.dataset.f) return;
      FILTER = e.target.dataset.f;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === e.target));
      render();
    });
    $('search').addEventListener('input', render);

    // A returning visit either still has a valid cookie or it does not, and
    // only the server can say which.
    (async () => {
      try {
        const res = await fetch('/api/auth', { credentials: 'same-origin' });
        if (res.ok) { ME = (await res.json()).user; load(); }
      } catch (e) {}
    })();
  </script>
</body>
</html>
